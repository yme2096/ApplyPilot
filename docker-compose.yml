services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-applypilot}
      POSTGRES_USER: ${POSTGRES_USER:-applypilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5174}
      APP_RATE_LIMIT_AUTH_MAX: ${APP_RATE_LIMIT_AUTH_MAX:-20}
      APP_RATE_LIMIT_IMPORT_MAX: ${APP_RATE_LIMIT_IMPORT_MAX:-30}
      APP_RATE_LIMIT_AI_MAX: ${APP_RATE_LIMIT_AI_MAX:-10}
      APP_RATE_LIMIT_WINDOW_SECONDS: ${APP_RATE_LIMIT_WINDOW_SECONDS:-60}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-2s}
      REDIS_COMMAND_TIMEOUT: ${REDIS_COMMAND_TIMEOUT:-2s}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-3000}
      DB_VALIDATION_TIMEOUT_MS: ${DB_VALIDATION_TIMEOUT_MS:-1000}
      APP_WORKER_CONNECT_TIMEOUT_SECONDS: ${APP_WORKER_CONNECT_TIMEOUT_SECONDS:-3}
      APP_WORKER_REQUEST_TIMEOUT_SECONDS: ${APP_WORKER_REQUEST_TIMEOUT_SECONDS:-45}
      UPLOAD_DIR: /app/data/uploads
      WORKER_URL: http://document-worker:8000
      SERVER_PORT: 8080
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_STARTTLS: ${SPRING_MAIL_STARTTLS:-true}
    ports: ["127.0.0.1:8081:8080"]
    volumes: ["resume_data:/app/data/uploads"]
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "ai.applypilot.config.HealthProbe"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      document-worker: {condition: service_started}
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports: ["127.0.0.1:5174:80"]
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-applypilot}
      POSTGRES_USER: ${POSTGRES_USER:-applypilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-applypilot} -d ${POSTGRES_DB:-applypilot}"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  document-worker:
    build: ./worker
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:
  redis_data:
  resume_data:

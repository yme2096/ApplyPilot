name: Verify and publish release images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm test -- --run
        working-directory: extension
      - run: npm run build
        working-directory: extension

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: python -m pip install -r worker/requirements.txt
      - run: python -m unittest discover -s worker -p 'test_*.py'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit frontend and extension dependencies
        run: |
          npm audit --audit-level=high
          npm audit --audit-level=high --prefix extension
      - name: Audit Python worker dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          mkdir -p security-reports
          pip-audit --strict --requirement worker/requirements.txt --format json > security-reports/worker-pip-audit.json
      - name: Generate complete Maven dependency SBOM
        run: >-
          mvn -B -f backend/pom.xml test
          org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom
          -DincludeTestScope=true -DoutputFormat=json
          -DoutputName=applypilot-backend-all
          -DoutputDirectory=${{ github.workspace }}/security-reports
      - name: Install checksum-verified Trivy
        env:
          TRIVY_VERSION: 0.76.1
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --fail --silent --show-error --location "$base/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          curl --fail --silent --show-error --location "$base/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy-checksums.txt
          (cd /tmp && grep "  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" trivy-checksums.txt | sha256sum --check --status)
          mkdir -p /tmp/trivy-bin
          tar -xzf /tmp/trivy.tar.gz -C /tmp/trivy-bin trivy
          echo /tmp/trivy-bin >> "$GITHUB_PATH"
      - name: Scan complete Maven graph and enforce accepted-risk policy
        run: |
          trivy sbom --scanners vuln --format json --output security-reports/trivy-backend-all.json security-reports/applypilot-backend-all.json
          trivy sbom --scanners vuln --ignorefile .trivyignore --severity HIGH,CRITICAL --exit-code 1 security-reports/applypilot-backend-all.json
      - name: Upload machine-readable dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-reports
          path: security-reports/*
          if-no-files-found: warn

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated E2E services
        run: docker compose -p applypilot-e2e -f docker-compose.e2e.yml up -d --build --wait
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run test:perf
        working-directory: frontend
      - run: npm run test:recovery
        working-directory: frontend
      - name: Stop isolated services without removing volumes
        if: always()
        run: docker compose -p applypilot-e2e -f docker-compose.e2e.yml down --remove-orphans

  publish-images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, extension, worker, security, browser-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize package owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: api
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/applypilot-api:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        id: web
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_URL=/api
          tags: ghcr.io/${{ steps.owner.outputs.name }}/applypilot-web:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        id: worker
        with:
          context: ./worker
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/applypilot-worker:${{ github.ref_name }}
      - name: Write immutable image references
        env:
          IMAGE_OWNER: ${{ steps.owner.outputs.name }}
          RELEASE_TAG: ${{ github.ref_name }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          {
            echo "APPLYPILOT_API_IMAGE=ghcr.io/${IMAGE_OWNER}/applypilot-api@${API_DIGEST}"
            echo "APPLYPILOT_WEB_IMAGE=ghcr.io/${IMAGE_OWNER}/applypilot-web@${WEB_DIGEST}"
            echo "APPLYPILOT_WORKER_IMAGE=ghcr.io/${IMAGE_OWNER}/applypilot-worker@${WORKER_DIGEST}"
          } > release-images.env
      - uses: actions/upload-artifact@v4
        with:
          name: immutable-release-image-references
          path: release-images.env
          if-no-files-found: error

name: Backend dependency security

on:
  push:
    paths:
      - "backend/**"
      - ".trivyignore"
      - ".github/workflows/backend-dependency-security.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".trivyignore"
      - ".github/workflows/backend-dependency-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test backend and generate complete test-scope SBOM
        run: >-
          mvn -B -f backend/pom.xml test
          org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom
          -DincludeTestScope=true -DoutputFormat=json
          -DoutputName=applypilot-backend-all
          -DoutputDirectory=${{ github.workspace }}/security-reports
      - name: Install checksum-verified Trivy
        env:
          TRIVY_VERSION: 0.76.1
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --fail --silent --show-error --location "$base/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          curl --fail --silent --show-error --location "$base/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy-checksums.txt
          (cd /tmp && grep "  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" trivy-checksums.txt | sha256sum --check --status)
          mkdir -p /tmp/trivy-bin
          tar -xzf /tmp/trivy.tar.gz -C /tmp/trivy-bin trivy
          echo /tmp/trivy-bin >> "$GITHUB_PATH"
      - name: Scan complete Maven dependency graph and write JSON report
        run: |
          mkdir -p security-reports
          trivy sbom --scanners vuln --format json \
            --output security-reports/trivy-backend-all.json \
            security-reports/applypilot-backend-all.json
      - name: Enforce high and critical policy
        run: >-
          trivy sbom --scanners vuln --ignorefile .trivyignore
          --severity HIGH,CRITICAL --exit-code 1
          security-reports/applypilot-backend-all.json
      - name: Upload machine-readable reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-security-reports
          path: |
            security-reports/applypilot-backend-all.json
            security-reports/trivy-backend-all.json
          if-no-files-found: warn

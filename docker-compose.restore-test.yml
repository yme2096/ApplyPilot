name: applypilot-restore-drill
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: restore_admin
      POSTGRES_USER: restore_user
      POSTGRES_PASSWORD: isolated-restore-only-local
    ports: ["127.0.0.1:55434:5432"]
    volumes: ["restore_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restore_user -d restore_admin"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  restore_data:
    name: applypilot-restore-drill-data
